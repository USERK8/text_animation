<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Layered Rotating Blocks</title>
<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');

  :root {
    --die-height: 56px;
    --cube-depth: 200px;
    --stack-size: 20;
  }

  html, body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, #141414 0%, #000 70%);
    font-family: "Montserrat", sans-serif;
    font-weight: 900;
    overflow: hidden;
    cursor: pointer;
  }

  .pov {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tray {
    display: flex;
    flex-direction: column;
    gap: 0;
    align-items: center;
    padding-bottom: 9px;
  }

  .cube-container {
    width: 400px;
    height: var(--die-height);
    perspective: 999px;
  }

  .cube {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
  }

  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    color: white;
    backface-visibility: hidden;
    transform-origin: 50% 50% calc(var(--cube-depth) * -1);
    letter-spacing: -1px;
    overflow: hidden;
  }

  .front  { transform: translateZ(var(--cube-depth)); }
  .back   { transform: translateZ(calc(var(--cube-depth) * -1)) rotateY(180deg); }
  .right  { transform: translateX(var(--cube-depth)) rotateY(90deg); }
  .left   { transform: translateX(calc(var(--cube-depth) * -1)) rotateY(-90deg); }

  /* each layer gets a faint seam + its own accent tint, like separate Rubik's slabs */
  .cube-container {
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: sans-serif;
    font-weight: 400;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="pov">
    <div class="tray"></div>
  </div>
  <div class="hint">click to shuffle the layers</div>

<script>
(() => {
  const STACK_SIZE = 20;
  const DIE_HEIGHT = 56;

  // One word per layer. Cycled if there are fewer words than layers.
  const wordSets = [
    ['WUT','YOU','DOING','BRUH','FR','FR','NO','CAP','HOLD','UP','WAIT','WHAT','KEEP','IT','ONE','HUNNID','ALWAYS','LOL','OKAY','BET'],
    ['ROTATE','THESE','BLOCKS','LIKE','A','RUBIKS','CUBE','LAYER','BY','LAYER','EACH','ONE','SPINS','ON','ITS','OWN','TIME','AND','PACE','NICE'],
    ['STACK','THE','LAYERS','TWIST','THEM','ALL','INDEPENDENT','MOTION','EVERY','BLOCK','DOES','ITS','OWN','THING','BUT','TOGETHER','THEY','FORM','ONE','TOWER'],
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tray = document.querySelector('.tray');

  function buildLayer(word) {
    const container = document.createElement('div');
    container.className = 'cube-container';
    container.innerHTML = `
      <div class="cube">
        <div class="face front">${word}</div>
        <div class="face back">${word}</div>
        <div class="face right">${word}</div>
        <div class="face left">${word}</div>
      </div>`;
    return container;
  }

  let dice = [];

  function renderLayers(words) {
    tray.innerHTML = '';
    dice = [];
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < STACK_SIZE; i++) {
      const word = words[i % words.length];
      const die = buildLayer(word);
      fragment.appendChild(die);
      dice.push(die);
    }
    tray.appendChild(fragment);

    dice.forEach(die => {
      die.querySelectorAll('.face').forEach((face, idx) => {
        const ry = [270, 0, 90, 180][idx];
        gsap.set(face, { z: 200, rotateY: ry });
      });
    });

    animateLayers();
  }

  function animateLayers() {
    if (reduceMotion) return;
    dice.forEach((die, i) => {
      const cube = die.querySelector('.cube');
      const direction = i % 2 === 0 ? 1 : -1;       // alternate spin direction, like real Rubik's layers
      const duration = gsap.utils.random(1.2, 2.6);  // independent speed per layer
      const delay = gsap.utils.random(0, 1.5);       // independent start offset

      gsap.timeline({ repeat: -1, yoyo: true, delay, defaults: { ease: 'power2.inOut' } })
        .fromTo(cube,
          { rotateY: -90 * direction },
          { rotateY: 90 * direction, duration });
    });
  }

  function layout() {
    const h = STACK_SIZE * DIE_HEIGHT;
    gsap.set('.tray', { height: h });
    gsap.set('.pov', { scale: window.innerHeight / h });
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 100);
  });
  window.addEventListener('load', layout);

  let setIndex = 0;
  renderLayers(wordSets[setIndex]);
  layout();

  document.body.addEventListener('click', () => {
    setIndex = (setIndex + 1) % wordSets.length;
    renderLayers(wordSets[setIndex]);
    layout();
    gsap.fromTo('.tray', { scale: 1.05 }, { scale: 1, duration: 0.4, ease: 'back.out(2)', overwrite: 'auto' });
  });
})();
</script>
</body>
</html>
